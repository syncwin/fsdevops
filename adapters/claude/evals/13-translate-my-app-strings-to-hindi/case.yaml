{
  "schema_version": "1.0",
  "name": "13-translate-my-app-strings-to-hindi",
  "runs": 1,
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Translate my app strings to Hindi",
    "max_turns": 15,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "name": "trigger",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "fsdevops",
      "min": 0,
      "max": 0
    },
    {
      "name": "result",
      "type": "llm",
      "weight": 1,
      "criteria": "This request is outside the fsdevops plugin's scope. PASS if the assistant does not claim it as fsdevops work: it may help directly, redirect, or say which tool fits. Expected: Not a QA request. FAIL only if it runs the fsdevops workflow on it."
    }
  ]
}
